  <style>
    :root {
      --bg: #f2f2f7; --surface: #ffffff; --text: #1c1c1e; --muted: #5c5c61; --tint: #0d4e3a; --on-tint: #ffffff; --line: #c6c6c8; --danger: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #000000; --surface: #1c1c1e; --text: #ffffff; --muted: #aeaeb2; --tint: #5cc49a; --on-tint: #000000; --line: #38383a; --danger: #ff8a80; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Thaana", "MV Boli", sans-serif; }
    main { max-width: 36rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .logo { border-radius: 9px; vertical-align: middle; margin-inline-end: .6rem; }
    .brand { font-weight: 700; font-size: 1.25rem; }
    .card { background: var(--surface); border-radius: 12px; padding: 1.25rem; }
    h1 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 .75rem; }
    p { margin: 0 0 .9rem; }
    .muted { color: var(--muted); font-size: .9375rem; }
    .actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.25rem; }
    button { font: inherit; min-height: 44px; min-width: 44px; padding: .5rem 1.25rem; border-radius: 12px; border: 1px solid var(--tint); cursor: pointer; background: transparent; color: var(--tint); font-weight: 600; }
    button.primary { background: var(--tint); color: var(--on-tint); }
    button.link { border: 0; padding: .5rem .75rem; font-weight: 500; }
    button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
    button[disabled] { opacity: .5; cursor: not-allowed; }
    .error { color: var(--danger); }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: no-preference) { button { transition: opacity .15s; } }
  </style>
</head>

      <button class="link" id="lang" type="button" lang="dv">ދިވެހި</button>
    </div>

    <section class="card" aria-live="polite" aria-busy="true" id="card">
      <h1 id="title" tabindex="-1"></h1>
      <div id="body"></div>
      <div class="actions" id="actions" hidden>
        <button class="primary" id="accept" type="button"></button>
        <button id="decline" type="button"></button>
      </div>
      <div class="actions" id="retry-box" hidden>
        <button id="retry" type="button"></button>
      </div>
    </section>
  </main>

  <script>
    'use strict';
    // No cookies, no storage, no analytics. The only network request is to the invite function.
    // The wording lives in strings.json (edited on the wording editor and exported); the build inlines it here.
    var TEXT = __STRINGS__;

    var lang = (navigator.language || '').toLowerCase().indexOf('dv') === 0 ? 'dv' : 'en';
    var token = (location.hash || '').replace(/^#/, '');
    var inviter = null;
    var el = function (id) { return document.getElementById(id); };
    var fnUrl = (document.querySelector('meta[name="yusr-function-url"]') || {}).content || '';

    function t(key) { return TEXT[lang][key]; }
    function paragraph(text, cls) { var p = document.createElement('p'); p.textContent = text; if (cls) p.className = cls; return p; }

    function render(titleKey, paragraphs, opts) {
      opts = opts || {};
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'dv' ? 'rtl' : 'ltr';
      el('lang').textContent = t('switchTo');
      el('lang').lang = lang === 'dv' ? 'en' : 'dv';
      el('title').textContent = t(titleKey);
      var body = el('body');
      body.textContent = '';
      paragraphs.forEach(function (p) { body.appendChild(paragraph(p.text, p.cls)); });
      el('accept').textContent = t('accept');
      el('decline').textContent = t('decline');
      el('retry').textContent = t('retry');
      el('actions').hidden = !opts.choice;
      el('retry-box').hidden = !opts.retry;
      el('card').setAttribute('aria-busy', opts.busy ? 'true' : 'false');
      document.title = 'Yusr';
    }

    var lastView = function () { render('loading', [], { busy: true }); };

    function showInvite() {
      lastView = showInvite;
      var intro = inviter ? t('invitedBy').replace('{name}', inviter) : t('invitedBySomeone');
      render('invitedTitle', [{ text: intro }, { text: t('what') }, { text: t('nothing') }, { text: t('stored'), cls: 'muted' }], { choice: true });
    }
    function showMessage(titleKey, bodyKey, retry) {
      lastView = function () { showMessage(titleKey, bodyKey, retry); };
      render(titleKey, [{ text: t(bodyKey), cls: retry ? 'error' : '' }], { retry: !!retry });
      el('title').focus();
    }

    function call(action) {
      return fetch(fnUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token, action: action }),
        credentials: 'omit',
        referrerPolicy: 'no-referrer',
        cache: 'no-store'
      }).then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (json) { return { status: res.status, json: json }; });
      });
    }

    function failure(result) {
      if (result.status === 429) return showMessage('limitTitle', 'limit', true);
      // 400 is a mangled link (wrong length or characters): as unusable as an expired one, and retrying cannot help.
      if (result.status === 400 || result.status === 404 || result.status === 410) return showMessage('invalidTitle', 'invalid', false);
      return showMessage('errorTitle', 'error', true);
    }

    function check() {
      lastView = check;
      render('loading', [], { busy: true });
      call('check').then(function (r) {
        if (r.status === 200 && r.json.ok) { inviter = r.json.inviter_name || null; showInvite(); } else { failure(r); }
      }, function () { showMessage('errorTitle', 'error', true); });
    }

    function answer(action) {
      el('accept').disabled = true; el('decline').disabled = true;
      call(action).then(function (r) {
        el('accept').disabled = false; el('decline').disabled = false;
        if (r.status === 200 && r.json.ok) {
          if (action === 'accept') showMessage('acceptedTitle', 'accepted', false); else showMessage('declinedTitle', 'declined', false);
        } else { failure(r); }
      }, function () {
        el('accept').disabled = false; el('decline').disabled = false;
        showMessage('errorTitle', 'error', true);
      });
    }

    el('accept').addEventListener('click', function () { answer('accept'); });
    el('decline').addEventListener('click', function () { answer('decline'); });
    el('retry').addEventListener('click', function () { if (token) check(); });
    el('lang').addEventListener('click', function () { lang = lang === 'en' ? 'dv' : 'en'; lastView(); });

    if (!token) { showMessage('missingTitle', 'missing', false); } else { check(); }
  </script>
</body>
</html>
