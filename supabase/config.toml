project_id = "kharadhu"

[api]
schemas = ["public", "graphql_public"]

[db]
major_version = 17

# JWT is verified inside the function with auth.getUser(), which works with the project's
# current signing keys; the gateway check is off because it does not.
[functions.scan-receipt]
verify_jwt = false

# Public invite endpoint: the invite token is the credential.
[functions.accept-invite]
verify_jwt = false

# Called by a scheduler with a shared secret (x-cron-secret). Nothing in this repo schedules it.
[functions.release-ladder]
verify_jwt = false

[functions.delete-account]
verify_jwt = false
