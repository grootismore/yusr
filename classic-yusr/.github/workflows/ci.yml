name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --ci
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  # Proves user A cannot read or write user B's data: pgTAP plus the real client API against
  # a local Supabase running in Docker.
  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase (database, auth and REST API only)
        run: npx supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: RLS tests (SQL)
        run: npx supabase test db
      - name: Serve the invite function
        run: |
          npx supabase functions serve accept-invite --no-verify-jwt > functions.log 2>&1 &
          for i in $(seq 1 90); do curl -sf -X OPTIONS http://127.0.0.1:54321/functions/v1/accept-invite && break; sleep 2; done
      - name: Integration tests (real HTTP, RLS, idempotent upserts, invite function)
        run: |
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          LOCAL_SUPABASE_URL="$API_URL" LOCAL_SUPABASE_KEY="$ANON_KEY" LOCAL_FUNCTIONS_URL="$API_URL/functions/v1" npm run test:integration
      - name: Function log (on failure)
        if: failure()
        run: cat functions.log || true
