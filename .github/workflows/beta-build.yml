name: Beta build (unsigned iOS IPA, installable Android APK)

# Test builds of Kharadhu on GitHub's runners, with no Apple Developer account, no Expo account and no store.
# Adapted from the classic Yusr beta workflow.
#   iOS      unsigned .ipa. Codesigning is skipped; SideStore or AltStore re-signs it with your own free Apple ID
#            when you install it (it expires every 7 days unless the store refreshes it). Sign in with Apple and
#            push entitlements are removed because a free Apple ID cannot sign them: sign in with email instead.
#   Android  .apk signed with the standard debug key, so it installs directly. Fine for testers, not for Play.
#
# Manual only (Actions, Beta build, Run workflow). macOS minutes count 10x on a private repo.
#
# Optional repository variables (Settings, Secrets and variables, Actions, Variables). None are needed: the
# defaults below are the public values for yusr-prod. These ship inside the app, so they are variables, not secrets.
#   EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_KEY (the publishable key: NEVER a secret or service-role key),
#   EXPO_PUBLIC_APP_URL, EXPO_PUBLIC_LEGAL_URL, EXPO_PUBLIC_SUPPORT_EMAIL

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which build to make
        type: choice
        options: [both, android, ios]
        default: both

concurrency:
  group: beta-build-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://mettmzaljwrdyhxraunu.supabase.co' }}
  EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_KEY || 'sb_publishable_7IHzelFpVnrd8pWPCI56Iw_aQiFWa15' }}
  EXPO_PUBLIC_APP_URL: ${{ vars.EXPO_PUBLIC_APP_URL || 'https://kharadhu.expo.app' }}
  EXPO_PUBLIC_LEGAL_URL: ${{ vars.EXPO_PUBLIC_LEGAL_URL }}
  EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.EXPO_PUBLIC_SUPPORT_EMAIL }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refuse to build without a client-safe key
        run: |
          key="$EXPO_PUBLIC_SUPABASE_KEY"
          case "$key" in sb_publishable_*) ;; *) echo "::error::That is not a publishable key (sb_publishable_...). Never ship a secret or service-role key."; exit 1;; esac
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  android:
    needs: checks
    if: inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Generate native Android project
        run: npx expo prebuild -p android --clean --no-install
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/kharadhu-beta.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: kharadhu-beta-apk
          path: out/kharadhu-beta.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    needs: checks
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - name: Generate native iOS project
        run: npx expo prebuild -p ios --clean --no-install
      - name: Remove entitlements a free Apple ID cannot sign
        run: |
          for f in ios/*/*.entitlements; do
            /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.applesignin" "$f" || true
            /usr/libexec/PlistBuddy -c "Delete :aps-environment" "$f" || true
          done
      - name: Install CocoaPods
        working-directory: ios
        run: pod install
      - name: Archive (unsigned)
        working-directory: ios
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          mkdir -p build
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$PWD/build/App.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP_PATH=$(find build/App.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n1)
          if [ -z "$APP_PATH" ]; then echo "No .app found in the archive; see the Archive step." >&2; exit 1; fi
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -r -y -q kharadhu-beta-unsigned.ipa Payload)
          echo "IPA_PATH=ios/build/kharadhu-beta-unsigned.ipa" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: kharadhu-beta-unsigned-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14
