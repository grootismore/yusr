name: Deploy web
# Manual only. Builds the web app (invite page, trusted-person pages, delete-info) with the values stored as
# GitHub Actions variables, then publishes it to Netlify. The EXPO_PUBLIC_* values are public by design: they
# end up in the bundle. Only NETLIFY_AUTH_TOKEN is a secret.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_KEY }}
      EXPO_PUBLIC_APP_URL: ${{ vars.EXPO_PUBLIC_APP_URL }}
      EXPO_PUBLIC_LEGAL_URL: ${{ vars.EXPO_PUBLIC_LEGAL_URL }}
      EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.EXPO_PUBLIC_SUPPORT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: |
          npx expo export --platform web --output-dir dist
          # Single-page app: every path must serve index.html, or /accept?token=... is a 404.
          echo "/* /index.html 200" > dist/_redirects
      - name: Publish to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@17 deploy --dir=dist --prod --site "$NETLIFY_SITE_ID"
