name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --ci
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  # Proves user A cannot read or write user B's data: pgTAP plus the real client API against
  # a local Supabase running in Docker.
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase (database, auth and REST API only)
        run: npx supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: RLS tests (SQL)
        run: npx supabase test db
      - name: Sync API integration tests (real HTTP, RLS, idempotent upserts)
        run: |
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          LOCAL_SUPABASE_URL="$API_URL" LOCAL_SUPABASE_KEY="$ANON_KEY" npm run test:integration
